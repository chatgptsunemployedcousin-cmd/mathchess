<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 12px 32px}
h1{font-size:1.7rem;margin:0 0 4px;font-weight:600}

.sq.l{background:var(--bl,#ebecd0)}.sq.d{background:var(--bd,#739552)}

.w{color:#fff;text-shadow:0 .02em 0 rgba(0,0,0,.25)}

aside{width:min(92vw,400px);display:flex;flex-direction:column;gap:12px}
#score{display:flex;gap:16px;font-weight:500}
.lv{display:flex;gap:8px;align-items:center;font-weight:500}
[hidden]{display:none!important}.row{display:flex;gap:6px;flex-wrap:wrap}.row button,.row input,.row select{font:inherit;padding:8px;border-radius:8px;border:2px solid var(--dk);background:var(--card);color:var(--ink);min-width:0}.row input{flex:1}.row button{cursor:pointer}
#pl div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}#me{font-weight:500}#cl{max-height:140px;overflow:auto;background:var(--card);border-radius:8px;padding:6px;margin-bottom:6px;font-size:.95rem}

#score b{font-weight:600}
#status{padding:10px 14px;border-radius:10px;background:var(--dk);color:#fff;font-weight:500}
#card{background:var(--card);border-radius:12px;padding:16px;border:2px solid var(--dk)}
#q{font-size:1.25rem;font-weight:500;margin:0 0 12px;line-height:1.35}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#opts button{font:inherit;font-size:1.05rem;padding:12px 8px;border-radius:8px;border:2px solid var(--dk);background:transparent;color:var(--ink);cursor:pointer}
#opts button:hover:not(:disabled){background:var(--lt);color:#17262b}
#opts button:focus-visible,#new:focus-visible,.sq:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
#opts button.no{background:var(--bad);border-color:var(--bad);color:#fff}
#fb{margin-top:10px;min-height:1.4em;font-weight:500}
#new,#rb{font:inherit;padding:10px;border-radius:8px;border:2px solid var(--ac);background:transparent;color:var(--ink);cursor:pointer}
@media(max-width:420px){#opts{grid-template-columns:1fr}}
#srv,#rv,#lrn{position:fixed;inset:0;z-index:50;overflow:auto;background:radial-gradient(circle at 20% 30%,#1a2233,#0b0e14 60%);color:#fff;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.sw{max-width:900px;margin:0 auto;display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}.sw .bk{grid-column:1/-1;justify-self:start}
#srv button,#rv button,#lrn button{font:inherit;color:#fff;background:#161b26;border:1px solid #3a4254;padding:8px 14px;cursor:pointer}
.sh h2{font-size:2.6rem;margin:0}.sh p{color:#9aa3b5}.sh button{display:block;background:none!important;border:0!important;font-size:1.4rem;font-weight:600;padding:6px 0!important;text-align:left}
.sp{background:#10141d;border:1px solid #232a38}.st{display:flex;gap:12px;align-items:center;padding:10px}.st span{color:#8d96a8;flex:1}.st input{font:inherit;background:#0b0e14;color:#fff;border:1px solid #3a4254;padding:8px;min-width:0;width:40%}
.rw{display:grid;grid-template-columns:2fr 1.4fr .8fr;gap:8px;padding:14px 12px;border-top:1px solid #1f2634;align-items:center}.rw.hd{background:#0b0e14;font-size:.8rem;color:#9aa3b5;letter-spacing:.05em}
#sl{max-height:60vh;overflow:auto}#sl .rw{cursor:pointer}#sl .rw:hover,#sl .rw:focus-visible{background:#1a2131;outline:none}.nm{font-weight:600}#sl>:not(.rw){padding:16px;color:#9aa3b5}
@media(max-width:700px){.sw{grid-template-columns:1fr}.st{flex-wrap:wrap}.st input{width:100%}}
.co{position:absolute;font-size:calc(var(--s)/8*.2);font-weight:600;z-index:3;line-height:1;pointer-events:none}.co.rk{top:4%;left:5%}.co.fl{bottom:3%;right:5%}.sq.l .co{color:var(--bd,#739552)}.sq.d .co{color:var(--bl,#ebecd0)}.sq.mk::after{content:"";position:absolute;inset:0;background:#e5484d;opacity:.55}.blind .pc{visibility:hidden}.row label{display:flex;align-items:center;gap:4px}
.rr{display:grid;grid-template-columns:60px 80px 110px 1fr;gap:8px;padding:6px 0;border-top:1px solid #1f2634}#rvb .ml{max-height:50vh;overflow:auto}.t0{color:#7fd48a}.t1{color:#b7d98a}.t2{color:#f2c94c}.t3{color:#f28c3c}.t4{color:#ef5350}
#top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}#top>a,#top>span,#top summary{font:inherit;font-weight:500;padding:8px 16px;border-radius:999px;border:2px solid var(--dk);color:var(--ink);text-decoration:none;cursor:pointer;list-style:none;background:transparent}#top>span.on{background:var(--dk);color:#fff;cursor:default}#top>a:hover,#top summary:hover{background:var(--lt);color:#17262b}#top summary::-webkit-details-marker{display:none}
.dd{position:relative}.dd>div{position:absolute;top:110%;left:0;z-index:20;background:var(--card);border:2px solid var(--dk);border-radius:10px;display:flex;flex-direction:column;min-width:170px;overflow:hidden}.dd>div a{padding:10px 14px;color:var(--ink);text-decoration:none}.dd>div a:hover{background:var(--lt);color:#17262b}
#top button{font:inherit;font-weight:500;padding:8px 16px;border-radius:999px;border:2px solid var(--dk);color:var(--ink);background:transparent;cursor:pointer}#top>button:hover{background:var(--lt);color:#17262b}
#cdlg,#pgd,#pm,#cc,#gate{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}.cb{background:var(--card);color:var(--ink);border-radius:12px;padding:18px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}.cb h3{margin:0}.cb label{display:flex;flex-direction:column;gap:4px;font-weight:500}.cb input:not([type=file]){font:inherit;padding:8px;border-radius:8px;border:2px solid var(--dk);background:transparent;color:var(--ink)}
#fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:100;font-weight:600;font-size:min(14vw,110px);text-align:center;opacity:0;letter-spacing:.04em}
#fx.show{animation:pop var(--d,2.6s) ease-out forwards}#fx.mate{color:#fff;text-shadow:0 0 12px #e5484d,0 0 40px #e5484d,0 4px 0 #7a1217;--d:2.6s}#fx.alien{color:#7dff6a;text-shadow:0 0 14px #2bd14a,0 0 50px #2bd14a;font-size:min(16vw,130px);--d:4.5s}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-6deg)}12%{opacity:1;transform:scale(1.25) rotate(2deg)}22%{transform:scale(1) rotate(0)}85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
@keyframes fade{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){#fx.show{animation-name:fade}}
#pl{font:inherit;font-size:1.25rem;font-weight:600;padding:12px;border-radius:10px;border:0;background:#81b64c;color:#fff;cursor:pointer}
#ml{max-height:150px;overflow:auto;background:var(--card);border:2px solid var(--dk);border-radius:10px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:2px 8px;min-height:2.2em}.mn{color:var(--mut)}.mv{cursor:pointer;font-weight:500;padding:0 3px;border-radius:4px}.mv.cur{background:var(--ac);color:#17262b}
#cl2{display:contents}.ed{padding:8px 10px!important}.disg .lv{display:none}#lrn .on{background:#81b64c!important}.cb textarea{font:inherit;padding:8px;border-radius:8px;border:2px solid var(--dk);background:transparent;color:var(--ink)}
#cb{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,94vw);z-index:70;background:var(--card);color:var(--ink);border:2px solid var(--dk);border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.4)}#cb p{margin:6px 0}
#fx.rook{color:#ffd23f;text-shadow:0 0 14px #ff7a00,0 0 40px #ff3d00;font-size:min(8.5vw,84px);--d:3.5s;padding:0 12px;word-break:break-all}
#bwrap{display:flex;flex-direction:column}.pb{display:flex;justify-content:space-between;align-items:center;width:var(--s);padding:6px 2px;font-weight:600;min-height:2.4rem}
.ck{background:var(--card);border:2px solid var(--dk);border-radius:8px;padding:2px 10px;font-size:1.3rem;font-variant-numeric:tabular-nums}.ck.on{background:var(--dk);color:#fff}.ck.low{background:#c0392b;color:#fff}
.av{width:46px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}.spk{display:flex;gap:10px;align-items:center}.bub{background:#fff;color:#17262b;border-radius:12px;padding:12px;flex:1}
#cm{display:flex;gap:8px;align-items:center;width:var(--s);margin-bottom:6px}#cmt{background:#fff;color:#17262b;border-radius:10px;padding:8px 12px;flex:1}#ev2{background:#ddd;color:#17262b;border-radius:6px;padding:0 6px;font-size:.85rem}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:42vh;overflow:auto}.cgi{font:inherit;background:transparent;border:3px solid transparent;border-radius:10px;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px}.cgi.on{border-color:#81b64c;color:#81b64c}.cgi .av{width:100%;height:auto;aspect-ratio:1;font-size:38px}
#pm .cb,#cc .cb{background:#2b2926;color:#fff;max-height:92vh;overflow:auto}#pm select{font:inherit;padding:8px;border-radius:8px;border:2px solid #555;background:#3d3b37;color:#fff}
.pcard{font:inherit;text-align:left;padding:14px;border-radius:10px;border:0;background:#3d3b37;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px}.pcard b{font-size:1.2rem}.pcard span{opacity:.8;font-size:.9rem}.pcard:hover{background:#4a4845}
#ccok,#pmx{font:inherit;font-size:1.1rem;font-weight:600;padding:12px;border:0;border-radius:10px;background:#81b64c;color:#fff;cursor:pointer}#pmx{background:#555}

#gate{z-index:200!important;background:#1d1c1a!important}#gate .cb{background:#2b2926;color:#fff}.gb{font:inherit;font-weight:600;padding:10px 14px;border-radius:10px;border:2px solid #81b64c;background:transparent;color:#fff;cursor:pointer}.gb.p{background:#81b64c}#gate .row .gb{flex:1}#gmsg{min-height:1.3em}

<script>
(()=>{
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const f=x=>String(+(+x).toFixed(4));
const sh=a=>[...a].sort(()=>Math.random()-.5);
const co=n=>n==1?'':n;
const sg=n=>n<0?'− '+(-n):'+ '+n;
const N=(q,c,w)=>[q,f(c),w.map(f)];
const G=[
()=>{const ds=sh([1,2,3,4,5,6,7,8,9]).slice(0,5),k=R(0,4),n=+ds.join(''),v=p=>(ds[k]*10**p).toLocaleString('en-US');
 return[`What is the value of the digit ${ds[k]} in ${n.toLocaleString('en-US')}?`,v(4-k),[0,1,2,3,4].filter(p=>p!=4-k).map(v)]},
()=>{const n=R(1000,99999),u=[10,100,1000][R(0,2)],c=Math.round(n/u)*u;
 return N(`Round ${n.toLocaleString('en-US')} to the nearest ${u}.`,c,[c+u,c-u,Math.floor(n/u)*u+u*2])},
()=>{const x=R(10000,99999)/10000,c=+x.toFixed(2);
 return N(`Round ${f(x)} to 2 decimal places.`,c,[+x.toFixed(1),+x.toFixed(3),c+.01,c-.01])},
()=>{const a=R(100,999)/10,b=R(10,99)/100;return N(`${f(a)} + ${f(b)} =`,a+b,[a+b+.1,a+b-.1,a+b+1,a+b-.9,(a+b)*10])},
()=>{const a=R(200,999)/10,b=R(10,99)/100;return N(`${f(a)} − ${f(b)} =`,a-b,[a-b+.1,a-b-.1,a-b+1,a-b+.9,a-b-.8])},
()=>{const a=R(12,98)/10,b=R(2,9),c=a*b;return N(`${f(a)} × ${b} =`,c,[c*10,c/10,c+1,c-1])},
()=>{const n=R(10,99),c=n/8;return N(`${n} ÷ 8 =`,c,[c+.125,c-.125,c+.25,c*10,c+1])},
()=>{const a=R(2,9),b=R(2,9),c=R(2,9),r=a+b*c;return N(`${a} + ${b} × ${c} =`,r,[(a+b)*c,r+1,r-1,r+c])},
()=>{const a=R(2,9),s=R(2,9),b=R(2,9);return N(`${a}² + √${s*s} × ${b} =`,a*a+s*b,[(a*a+s)*b,a*a+s*b+s,a+s+b,a*2+s*b])},
()=>{const a=R(1,5),b=R(1,4),c=R(2,9),r=(a+b)**2-c;return N(`(${a} + ${b})² − ${c} =`,r,[a*a+b*b-c,(a+b)*2-c,r+c*2,r+2])},
